appId: app.cozydesk.desktop
productName: CozyDesk
copyright: CozyDesk 2026

directories:
  output: release
  buildResources: build

# L'application est entièrement bundlée par Vite (dist/) et esbuild (dist-electron/) :
# aucun node_module applicatif n'est embarqué dans le paquet final.
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - "!**/*.map"

compression: normal

win:
  icon: build/icon.ico
  # signAndEditExecutable: false → construire sous Linux sans wine (l'incrustation
  # de l'icône dans le .exe nécessite wine). Sur une machine Windows, retirez
  # cette ligne (ou lancez `npm run dist`) pour obtenir l'exe avec l'icône
  # CozyDesk. L'icône de l'installateur reste appliquée dans tous les cas.
  signAndEditExecutable: false
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CozyDesk
  artifactName: CozyDesk-Setup-${version}.${ext}

portable:
  artifactName: CozyDesk-Portable-${version}.${ext}
